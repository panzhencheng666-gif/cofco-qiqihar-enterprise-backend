<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>员工注册</title>
<style>body{font:16px system-ui;background:#eef4f7;color:#173746;margin:0}main{max-width:680px;margin:5vh auto;background:white;padding:32px;border-radius:16px;border:1px solid #c3d7e2}label{display:block;margin-top:18px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #b6cbd5;border-radius:6px;font:inherit}button,.action{display:inline-block;background:#0b3446;color:white;padding:13px 20px;border:0;border-radius:6px;font:inherit;margin-top:20px;text-decoration:none}button:disabled{opacity:.5}small{display:block;color:#526e7b;margin-top:8px}#status{white-space:pre-wrap}a{color:#0b617f}[hidden]{display:none!important}@media(max-width:720px){main{margin:12px;padding:22px}}</style>
<main><h1>员工注册</h1><p>创建普通员工账号，完成后即可使用授权范围内的业务功能。</p>
<form id="form" hidden><h2>填写员工资料</h2><p>账号类型：<strong>普通账号（填报员）</strong></p>
<label>姓名<input id="name" required maxlength="160" autocomplete="name"></label>
<label>工作单位<select id="unit" required></select></label>
<label id="positionsLabel" hidden>岗位<select id="positions" multiple size="4"></select></label>
<label>授权地区<input id="search" type="search" placeholder="搜索地区名称"><select id="regions" multiple size="10" required aria-label="授权地区"></select></label><small>可选择多个尚未绑定的地区；每个地区仅允许一个普通账号绑定，选项与邀请员工一致。选择后立即获得普通业务权限，地区负责人仍由管理员安排。</small>
<button id="submit" type="submit">完成注册并进入系统</button></form>
<p id="status" role="status" aria-live="polite"></p><a id="enter" href="/oauth2/authorization/enterprise" hidden>重新登录并进入系统</a><p><a href="/">返回登录页面</a></p></main>
<script>
const el=id=>document.getElementById(id);let generation=0,busy=false;
function populate(select,items){select.replaceChildren(...items.map(item=>{const o=document.createElement('option');o.value=item.code;o.textContent=item.name;return o}));}
async function message(response){try{const body=await response.json();return body.error?.message||'请求失败，请重试。'}catch{return '服务暂时不可用，请稍后重试。'}}
async function load(unit='QIQIHAR_BUSINESS'){
 const current=++generation;el('submit').disabled=true;
 try{const response=await fetch('/api/v1/identity/registration/options?workUnitCode='+encodeURIComponent(unit));
 if(current!==generation)return;
 if(response.status===401){location.replace('/oauth2/authorization/enterprise');return;}
 if(!response.ok){el('status').textContent=await message(response);return;}
 const {data}=await response.json();if(current!==generation)return;
 el('form').hidden=false;
 populate(el('unit'),data.workUnits);el('unit').value=unit;populate(el('positions'),data.positions);el('positionsLabel').hidden=!data.positions.length;
 populate(el('regions'),data.regions);el('search').value='';el('submit').disabled=!data.regions.length;el('status').textContent=data.regions.length?'':'该单位暂无可选择的未绑定地区，请更换单位或联系管理员解除原绑定。';
 }catch{if(current===generation)el('status').textContent='网络连接失败，请刷新页面重试。';}
}
el('unit').onchange=()=>load(el('unit').value);
el('search').oninput=()=>{for(const o of el('regions').options)o.hidden=!o.textContent.includes(el('search').value.trim());};
el('form').onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;el('submit').disabled=true;el('unit').disabled=true;el('status').textContent='正在创建员工账号…';
 try{const token=document.cookie.split('; ').find(x=>x.startsWith('XSRF-TOKEN='))?.slice(11);const response=await fetch('/api/v1/identity/registration',{method:'POST',headers:{'Content-Type':'application/json','X-XSRF-TOKEN':decodeURIComponent(token||'')},body:JSON.stringify({displayName:el('name').value.trim(),workUnitCode:el('unit').value,positionCodes:[...el('positions').selectedOptions].map(o=>o.value),regionCodes:[...el('regions').selectedOptions].map(o=>o.value),roleCodes:['BUSINESS_OPERATOR']})});
 if(response.ok){el('status').textContent='注册成功，正在进入系统…';location.assign('/oauth2/authorization/enterprise');return;}
 el('status').textContent=response.status===401?'登录已失效，请重新登录后继续。':await message(response);el('enter').hidden=false;
 }catch{el('status').textContent='连接中断。如果账号已创建，可直接重新登录；重复提交不会创建第二个账号。';el('enter').hidden=false;}
 finally{busy=false;el('submit').disabled=false;el('unit').disabled=false;}
 };
async function start(){
 if(new URLSearchParams(location.search).has('reauthenticate')){location.replace('/oauth2/authorization/enterprise?reauthenticate=1');return;}
 try{
  const session=await fetch('/api/v1/session/me',{cache:'no-store'});
  if(session.ok){location.replace('/');return;}
  if(session.status!==401&&session.status!==403){el('status').textContent=await message(session);return;}
  await load();
 }catch{el('status').textContent='网络连接失败，请刷新页面重试。';}
}
start();
</script></html>
