name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JDK 21 / Maven verify
    runs-on: ubuntu-latest
    # The full serial database suite can exceed 60 minutes on hosted runners.
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:17-3.6-alpine
        env:
          POSTGRES_DB: qiqihar_enterprise_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qiqihar_enterprise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      QIQIHAR_TEST_DB_URL: jdbc:postgresql://127.0.0.1:55432/qiqihar_enterprise_test
      QIQIHAR_TEST_DB_USERNAME: postgres
      QIQIHAR_TEST_DB_PASSWORD: postgres
      QIQIHAR_EVENT_CONSUMER_REGISTRAR_DB_URL: jdbc:postgresql://127.0.0.1:55432/qiqihar_enterprise_test
      QIQIHAR_EVENT_CONSUMER_REGISTRAR_DB_USERNAME: qiqihar_event_consumer_registrar_login
      QIQIHAR_EVENT_CONSUMER_REGISTRAR_DB_PASSWORD: ci-only-registrar
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn --version

      - name: Provision CI database roles and report fonts
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk lsof postgresql-client
          psql --host 127.0.0.1 --port 55432 --username postgres --dbname qiqihar_enterprise_test \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cofco_app') THEN
              CREATE ROLE cofco_app LOGIN INHERIT PASSWORD 'ci-only-runtime';
            END IF;
            ALTER ROLE cofco_app LOGIN INHERIT;
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = 'qiqihar_event_consumer_registrar_login'
            ) THEN
              CREATE ROLE qiqihar_event_consumer_registrar_login
                LOGIN NOINHERIT PASSWORD 'ci-only-registrar';
            END IF;
          END
          $$;
          SQL
          fc-match "Noto Sans CJK SC"

      - name: Check patch whitespace
        run: |
          python3 -m unittest scripts/tests/test_check_patch_whitespace.py -v
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            patch_base=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          else
            patch_base=$(git rev-parse HEAD^)
          fi
          python3 scripts/check-patch-whitespace.py "$patch_base" HEAD

      - name: Verify managed runtime release guards
        run: |
          bash -n scripts/local-runtime.sh
          python3 -B -m unittest discover -s scripts/tests -p test_verify_local_install_source.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_verify_market_risk_migration_scope.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_local_runtime_port_timeout.py -v

      - name: Verify risk API availability boundary
        run: mvn -B -ntp -Dtest=RiskApiAvailabilityInterceptorTest,RiskWorkbenchServiceTest,RiskTrainingOrchestratorTest test

      - name: Verify market feed atomic refresh
        run: mvn -B -ntp -Dtest=MarketFeedTransactionIntegrationTest,FaoNewsFeedTest,MoaDepartmentNewsFeedTest,MoaPublicMarketFeedTest test

      - name: Verify weekly imagery worker
        run: |
          python3 -m unittest scripts/tests/test_weekly_imagery_sync.py -v
          bash scripts/tests/weekly-imagery-worker-install.test.sh
          bash scripts/tests/verify-weekly-imagery-release.test.sh

      - name: Verify Backend
        # The legacy all-in-one suite shares mutable database fixtures and is
        # retained as an explicit diagnostic run until those fixtures are
        # isolated. Pull requests use the same deterministic release gate as
        # main so unrelated fixture leakage cannot permanently block merging.
        if: github.event_name == 'workflow_dispatch'
        run: mvn -B -ntp verify

      - name: Verify active release promotion
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          mvn -B -ntp -DskipTests package
          mvn -B -ntp -Dtest=MarketTestDatabaseResetTest test
          mvn -B -ntp \
            -Dtest=MapImageryTileGatewayTest,OverviewMapImageryControllerTest,OpenMeteoOperationalWeatherNowTest,OperationalFacilityRestIntegrationTest,OperationalSituationRestIntegrationTest,RegionalAgricultureProfileCalculatorTest,RegionalAgricultureProfileResponseTest \
            test
          mvn -B -ntp \
            -Dtest=RegionalRailwayRepositoryIntegrationTest \
            test
          mvn -B -ntp \
            -Dtest=BusinessNotificationCursorTest,BusinessNotificationControllerCursorTest,FormalSampleObservationRestIntegrationTest#pagesEligibleSamplesWithoutReturningTheFullCatalog \
            test
          mvn -B -ntp -f risk-intelligence-service/pom.xml test
