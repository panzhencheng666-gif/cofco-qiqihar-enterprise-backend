spring:
  profiles:
    active: test
  datasource:
    url: ${QIQIHAR_TEST_DB_URL}
    username: ${QIQIHAR_TEST_DB_USERNAME:${USER}}
    password: ${QIQIHAR_TEST_DB_PASSWORD:}
  flyway:
    url: ${QIQIHAR_TEST_DB_URL}
    user: ${QIQIHAR_TEST_DB_USERNAME:${USER}}
    password: ${QIQIHAR_TEST_DB_PASSWORD:}

qiqihar:
  business-event:
    consumer-registration:
      datasource:
        url: ${QIQIHAR_EVENT_CONSUMER_REGISTRAR_DB_URL:${QIQIHAR_TEST_DB_URL}}
        username: ${QIQIHAR_EVENT_CONSUMER_REGISTRAR_DB_USERNAME:qiqihar_event_consumer_registrar_login}
        password: ${QIQIHAR_EVENT_CONSUMER_REGISTRAR_DB_PASSWORD:}
  import:
    queue-enabled: false
  security:
    require-read-authentication: false
    test-default-subject: __UNRESTRICTED_TEST_READ__

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
