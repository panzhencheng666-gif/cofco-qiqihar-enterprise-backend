spring:
  config:
    activate:
      on-profile: local

server:
  address: 127.0.0.1

# The local browser demo has no SSO adapter. Keep production's authenticated
# read default intact and opt out only when the explicit local profile is used.
qiqihar:
  risk:
    training:
      artifact-root: ${QIQIHAR_RISK_MODEL_ARTIFACT_ROOT:./var/risk-models}
  security:
    require-read-authentication: false
    trusted-subject-header: X-Actor
