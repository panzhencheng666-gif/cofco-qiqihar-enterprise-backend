spring:
  application:
    name: grain-trade-enterprise-backend
  datasource:
    url: ${QIQIHAR_DB_URL:jdbc:postgresql://127.0.0.1:5432/qiqihar_enterprise_dev}
    username: ${QIQIHAR_DB_USERNAME:${USER}}
    password: ${QIQIHAR_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${QIQIHAR_FLYWAY_USERNAME:${USER}}
    password: ${QIQIHAR_FLYWAY_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${QIQIHAR_IMPORT_MAX_FILE_SIZE:20MB}
      max-request-size: ${QIQIHAR_IMPORT_MAX_REQUEST_SIZE:21MB}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${QIQIHAR_OIDC_ISSUER_URI:}

server:
  port: ${QIQIHAR_SERVER_PORT:8090}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${QIQIHAR_SESSION_TIMEOUT:30m}
      cookie:
        name: COFCO_SESSION
        http-only: true
        secure: ${QIQIHAR_SESSION_COOKIE_SECURE:true}
        same-site: strict

qiqihar:
  security:
    oidc:
      client-id: ${QIQIHAR_OIDC_CLIENT_ID:}
      client-secret: ${QIQIHAR_OIDC_CLIENT_SECRET:}
      authorization-uri: ${QIQIHAR_OIDC_AUTHORIZATION_URI:}
      token-uri: ${QIQIHAR_OIDC_TOKEN_URI:}
      jwk-set-uri: ${QIQIHAR_OIDC_JWK_SET_URI:}
      user-info-uri: ${QIQIHAR_OIDC_USER_INFO_URI:}
      end-session-uri: ${QIQIHAR_OIDC_END_SESSION_URI:}
      redirect-uri: ${QIQIHAR_OIDC_REDIRECT_URI:}
      post-logout-redirect-uri: ${QIQIHAR_OIDC_POST_LOGOUT_REDIRECT_URI:}
      mfa-amr-values: ${QIQIHAR_OIDC_MFA_AMR_VALUES:}
      mfa-acr-values: ${QIQIHAR_OIDC_MFA_ACR_VALUES:}
    session-cookie-secure: ${QIQIHAR_SESSION_COOKIE_SECURE:true}
  import:
    sync-row-limit: ${QIQIHAR_IMPORT_SYNC_ROW_LIMIT:5000}
    max-row-limit: ${QIQIHAR_IMPORT_MAX_ROW_LIMIT:50000}
    max-file-bytes: ${QIQIHAR_IMPORT_MAX_FILE_BYTES:20971520}
    queue-concurrency: ${QIQIHAR_IMPORT_QUEUE_CONCURRENCY:2}
    queue-poll-delay: ${QIQIHAR_IMPORT_QUEUE_POLL_DELAY:1s}
    queue-stale-after: ${QIQIHAR_IMPORT_QUEUE_STALE_AFTER:15m}
  request-limits:
    json-body-bytes: ${QIQIHAR_JSON_BODY_MAX_BYTES:1048576}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
