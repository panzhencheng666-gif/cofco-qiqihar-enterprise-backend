spring:
  application:
    name: qiqihar-risk-intelligence-service
  datasource:
    url: ${RISK_DB_URL:}
    username: ${RISK_DB_USERNAME:}
    password: ${RISK_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${RISK_DB_MAXIMUM_POOL_SIZE:6}
      minimum-idle: ${RISK_DB_MINIMUM_IDLE:1}
      connection-timeout: ${RISK_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${RISK_DB_VALIDATION_TIMEOUT_MS:2000}
  flyway:
    enabled: false

server:
  address: ${RISK_SERVER_ADDRESS:127.0.0.1}
  port: ${RISK_SERVER_PORT:63184}
  shutdown: graceful

qiqihar:
  risk:
    expected-database: ${RISK_EXPECTED_DATABASE:qiqihar_enterprise}
    ingestion-key: ${RISK_INGESTION_KEY:}
    business-session-url: ${RISK_BUSINESS_SESSION_URL:}
    training:
      enabled: ${RISK_TRAINING_ENABLED:false}
      artifact-root: ${RISK_MODEL_ARTIFACT_ROOT:}
      poll-delay: ${RISK_TRAINING_POLL_DELAY:10s}
      schedule-reconcile-delay: ${RISK_TRAINING_SCHEDULE_RECONCILE_DELAY:1m}
      lifecycle-delay: ${RISK_TRAINING_LIFECYCLE_DELAY:30s}
      llm:
        endpoint: ${RISK_LLM_TRAINER_URL:}
        scoring-endpoint: ${RISK_LLM_SCORING_URL:}
        bearer-token: ${RISK_LLM_BEARER_TOKEN:}
        base-model-reference: ${RISK_LLM_BASE_MODEL:}
      remote-node:
        enabled: ${RISK_TRAINING_REMOTE_NODE_ENABLED:false}
        token: ${RISK_TRAINING_NODE_TOKEN:}
        lease-duration: ${RISK_TRAINING_NODE_LEASE_DURATION:35m}
        artifact-root: ${RISK_TRAINING_NODE_ARTIFACT_ROOT:var/risk-remote-artifacts}
        maximum-artifact-bytes: ${RISK_TRAINING_NODE_MAXIMUM_ARTIFACT_BYTES:67108864}
        maximum-total-artifact-bytes: ${RISK_TRAINING_NODE_MAXIMUM_TOTAL_ARTIFACT_BYTES:1073741824}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
